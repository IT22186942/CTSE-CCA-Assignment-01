<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Microstore | Premium Tech</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
        <div class="shape shape-3"></div>
    </div>

    <main class="glass-container">
        <header>
            <h1>Microstore</h1>
            <p>Microservice E-Commerce Architecture</p>
            <div class="user-selector">
                <label for="userSelect">Shopping as:</label>
                <select id="userSelect">
                    <option value="1">John Doe (ID: 1)</option>
                    <option value="2">Jane Smith (ID: 2)</option>
                </select>
            </div>
        </header>

        <section class="products-section">
            <h2>Featured Products</h2>
            <div class="product-grid" id="productGrid">
                <!-- Products injected via JS -->
                <div class="loader">Loading products from Azure...</div>
            </div>
        </section>
    </main>

    <div id="toast-container"></div>

    <script src="app.js"></script>
</body>
</html>
